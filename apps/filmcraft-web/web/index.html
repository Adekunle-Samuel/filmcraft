<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FilmCraft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, sans-serif; pointer-events: none;
    }
    #loading img { width: 56px; height: 56px; }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="filmcraft_canvas"></canvas>
  <div id="loading"><img src="favicon.svg" alt=""><div id="status">Loading FilmCraft…</div></div>
  <script type="module">
    import init, { start } from "./filmcraft_web.js";
    const t0 = performance.now();
    window.filmcraftLoad = {};
    try {
      await init();
      window.filmcraftLoad.wasmMs = performance.now() - t0;
      await start("filmcraft_canvas");
      window.filmcraftLoad.readyMs = performance.now() - t0;
    } catch (e) {
      const s = document.getElementById("status");
      if (s) { s.className = "err"; s.textContent = "FilmCraft failed to start:\n" + (e && e.stack || e); }
      window.filmcraftLoad.error = String(e);
      throw e;
    }
  </script>
</body>
</html>
